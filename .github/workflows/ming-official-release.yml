name: Ming official component release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "官方组件 Release 标签"
        required: true
        default: "v26.4.1-rc4"
        type: string
  push:
    tags: ["v26.4.1-rc4"]

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev minisign
      - name: Build official Debian packages
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v26.4.1-rc4"
          mkdir -p release/packages
          mkdir -p release/staging/ming-store/usr/local/bin release/staging/ming-store/usr/local/lib/ming-os
          cp assets/ming-store.py release/staging/ming-store/usr/local/bin/ming-store
          cp assets/ming-store-core.py release/staging/ming-store/usr/local/lib/ming-os/ming-store-core.py
          chmod +x release/staging/ming-store/usr/local/bin/ming-store
          mkdir -p release/staging/ming-settings/usr/local/bin
          cp assets/ming-settings.py release/staging/ming-settings/usr/local/bin/ming-settings
          chmod +x release/staging/ming-settings/usr/local/bin/ming-settings
          mkdir -p release/staging/ming-diagnostic/usr/local/bin
          cp assets/ming-diagnostic-bundle.py release/staging/ming-diagnostic/usr/local/bin/ming-diagnostic-bundle
          chmod +x release/staging/ming-diagnostic/usr/local/bin/ming-diagnostic-bundle
          bash tools/build-ming-official-debs.sh 26.4.1~rc4 release/packages \
            'ming-store|Ming 应用商店|release/staging/ming-store' \
            'ming-settings|Ming 设置中心|release/staging/ming-settings' \
            'ming-diagnostic|Ming 诊断工具|release/staging/ming-diagnostic'
      - name: Generate and sign official catalog
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          MING_OFFICIAL_MINISIGN_KEY: ${{ secrets.MING_OFFICIAL_MINISIGN_KEY }}
          MING_OFFICIAL_MINISIGN_PUBLIC_KEY: ${{ secrets.MING_OFFICIAL_MINISIGN_PUBLIC_KEY }}
          MING_OFFICIAL_PUBLIC_KEY_FINGERPRINT: ${{ vars.MING_OFFICIAL_PUBLIC_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "$MING_OFFICIAL_MINISIGN_KEY" ] || [ -z "$MING_OFFICIAL_MINISIGN_PUBLIC_KEY" ]; then
            echo '缺少官方目录签名密钥 Secret。' >&2
            exit 1
          fi
          printf '%s\n' "$MING_OFFICIAL_MINISIGN_PUBLIC_KEY" > release/ming-official-catalog.minisign.pub
          python tools/generate-ming-official-catalog.py \
            --release-tag "${RELEASE_TAG}" --version 26.4.1~rc4 \
            --public-key-fingerprint "${MING_OFFICIAL_PUBLIC_KEY_FINGERPRINT:?}" \
            --input-dir release/packages --output release/ming-official.json
          key_file="$RUNNER_TEMP/ming-official.key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$MING_OFFICIAL_MINISIGN_KEY" > "$key_file"
          minisign -Sm release/ming-official.json -s "$key_file" -q
          minisign -Vm release/ming-official.json -x release/ming-official.json.minisig \
            -p release/ming-official-catalog.minisign.pub -q
          sha256sum release/ming-official-catalog.minisign.pub | awk '{print $1}' > \
            release/ming-official-catalog.minisign.pub.sha256
          sha256sum release/packages/*.deb release/ming-official.json release/ming-official.json.minisig \
            release/ming-official-catalog.minisign.pub release/ming-official-catalog.minisign.pub.sha256 > release/SHA256SUMS
          rm -f "$key_file"
          trap - EXIT
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --title "Ming OS ${RELEASE_TAG} 官方组件" --prerelease
          gh release upload "${RELEASE_TAG}" release/packages/*.deb release/ming-official.json \
            release/ming-official.json.minisig release/ming-official-catalog.minisign.pub \
            release/ming-official-catalog.minisign.pub.sha256 release/SHA256SUMS --clobber
