name: 功能建议
description: 提议一个可验证的新功能或改进
title: "[Feature] "
labels:
  - type:feature
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户问题，不要只描述实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 写出可以通过测试、日志或实际操作确认的条件。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响区域
      options:
        - 桌面和设置
        - 商店和软件安装
        - Wine
        - Android
        - 安装器和启动
        - OTA
        - 构建和测试
        - 文档
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: 风险等级
      options:
        - 普通用户态
        - 影响桌面会话
        - 需要 root、Polkit 或磁盘操作
        - 影响 OTA、签名或发布
    validations:
      required: true
